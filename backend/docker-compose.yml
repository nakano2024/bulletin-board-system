services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/bulletin_board?sslmode=disable
      THREAD_IMAGE_BASE_PATH: http://localhost:9000/images/
      REDIS_ADDR: redis:6379
      RUSTFS_ENDPOINT: http://localhost:9000
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_BUCKET: images
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      rustfs:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bulletin_board
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - rustfs_data:/data

  # rustfs-init creates the bucket the backend uploads into and makes it public-read (this is a
  # public, unauthenticated bulletin board: every posted image is meant to be viewable by anyone;
  # writes still require the app's presigned PUT signature). It runs once and exits; backend waits
  # for it to finish successfully before starting. Retries head-bucket/create-bucket until RustFS
  # is ready and the bucket exists, then (re)applies the read policy, so it's safe to re-run on
  # every `docker compose up`.
  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: images
    entrypoint: ["sh", "-c"]
    command:
      - >
        until aws --endpoint-url "$$RUSTFS_ENDPOINT" s3api head-bucket --bucket "$$RUSTFS_BUCKET" 2>/dev/null; do
          aws --endpoint-url "$$RUSTFS_ENDPOINT" s3api create-bucket --bucket "$$RUSTFS_BUCKET" 2>/dev/null;
          sleep 1;
        done &&
        echo "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::$$RUSTFS_BUCKET/*\"}]}" > /tmp/policy.json &&
        aws --endpoint-url "$$RUSTFS_ENDPOINT" s3api put-bucket-policy --bucket "$$RUSTFS_BUCKET" --policy file:///tmp/policy.json

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
